[book]
title = "Taxudromeio"
description = "Design, access boundaries, and verification of the Rust IMAP CLI and MCP server."
language = "en"
src = "book"

[build]
build-dir = "target/anchorbook"
create-missing = false

[preprocessor.anchorbook]
command = "target/book-tools/bin/anchorbook md"
config = "anchorbook.toml"
after = ["links"]

[preprocessor.mermaid]
command = "target/book-tools/bin/mdbook-mermaid"
after = ["anchorbook"]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
