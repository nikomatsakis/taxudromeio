[package]
name = "taxudromeio"
version = "0.1.0"
edition = "2024"
description = "A Keychain-backed, folder-scoped IMAP CLI and MCP server for mail triage"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
directories = "6"
der = { version = "0.7", features = ["oid"] }
imap = "2.4"
mailparse = "0.16"
native-tls = "0.2"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
rmcp = { version = "1.8", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
toml = "0.9"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
anchor-book = { git = "https://github.com/anchor-book/anchor-book", rev = "02945a9990de3481144edc8cd47808cdf231c135" }
tempfile = "3"
shlex = "2"
rmcp = { version = "1.8", features = ["client"] }

[lints.rust]
unsafe_code = "forbid"
